name: deploy PR previews

on:
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    - closed

concurrency: preview-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-preview-book:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v5

    - name: Install environment with uv
      run: |
        python -m pip install uv
        uv sync

    - name: Build HTML Assets
      run: |
        uv run jupyter-book build --html --execute

    # Deploy the preview
    - name: Deploy preview
      uses: rossjrw/pr-preview-action@v1
      with:
        source-dir: data-science-for-esm/_build/html
